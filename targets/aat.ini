# ********************************
# AAT VRX backpack -- Automatic antenna tracking
# ********************************
[env:AAT_ESP32_Backpack_via_UART]
extends = env_common_esp32
build_flags =
        ${common_env_data.build_flags}
        ${env_common_esp32.build_flags}
    -D TARGET_VRX_BACKPACK   
    -D AAT_BACKPACK          
    -D SSD1306_NO_SPLASH     
    -D PIN_BUTTON=25          
    -D PIN_LED=26            
    -D LED_INVERTED          
    -D PIN_SERVO_AZIM=27
    -D PIN_SERVO_ELEV=14
    -D PIN_OLED_SCL=21
    -D PIN_OLED_SDA=22
    -D DEBUG_LOG
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit SSD1306 @ 2.5.9
    madhephaestus/ESP32Servo
build_src_filter = ${common_env_data.build_src_filter} -<Tx_main.cpp> -<Test_main.cpp> -<rapidfire.*> -<rx5808.*> -<steadyview.*> -<Timer_main.cpp> -<mfd_crossbow.*>

[env:AAT_ESP_Backpack_via_UART]
extends = env_common_esp12e
board = nodemcuv2
board_build.ldscript = eagle.flash.4m2m.ld
upload_port = COM9
monitor_port = COM9
monitor_speed = 115200
build_flags =
	${common_env_data.build_flags}
	${env_common_esp12e.build_flags}
    -D TARGET_VRX_BACKPACK
    -D AAT_BACKPACK
    -D SSD1306_NO_SPLASH
    -D MY_BINDING_PHRASE=\"156,79,171,221,42,88\"
    -D PIN_BUTTON=0
    ; WS2812B on NodeMCU D4 (GPIO2), 4 RGB LEDs
    -D PIN_WS2812=2
    -D WS2812_COUNT=4
    ; Safe servo pins for NodeMCU V3 (avoid GPIO9/10 flash pins)
    -D PIN_SERVO_AZIM=14  ; D5
    -D PIN_SERVO_ELEV=12  ; D6
    ; OLED I2C (NodeMCU V3: D2=SDA=GPIO4, D1=SCL=GPIO5), addr 0x3C
    -D PIN_OLED_SCL=5     ; D1
    -D PIN_OLED_SDA=4     ; D2
    ; OLED mount: fixes L/R mirror after begin(). 0=normal(0xA0,0xC8), 1=180deg(0xA1,0xC0)
    -D OLED_MOUNT_ROTATED_180=0
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit SSD1306 @ 2.5.9
    adafruit/Adafruit NeoPixel @ 1.12.3
build_src_filter = ${common_env_data.build_src_filter} -<Tx_main.cpp> -<Test_main.cpp> -<rapidfire.*> -<rx5808.*> -<steadyview.*> -<Timer_main.cpp> -<mfd_crossbow.*>

[env:AAT_ESP_Backpack_via_WIFI]
extends = env:AAT_ESP_Backpack_via_UART
