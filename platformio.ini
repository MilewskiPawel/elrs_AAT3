; ELRS Backpack AAT - NodeMCU V3 (ESP8266 / ESP-12E)
; Build and flash: pio run -t upload
; Monitor serial:  pio device monitor

[env:nodemcuv3_aat]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino

; Serial / upload (NodeMCU V3 on COM9)
upload_port = COM9
monitor_port = COM9
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder

build_flags =
    -D CORE_DEBUG_LEVEL=0
    ; --- OLED (SSD1306 128x64, I2C, addr 0x3C) ---
    ; NodeMCU V3 safe I2C pins: D2=GPIO4 (SDA), D1=GPIO5 (SCL)
    ; (Remapped from C3 config: GPIO6 is a flash pin on ESP8266 and cannot be used)
    -D PIN_OLED_SDA=4
    -D PIN_OLED_SCL=5
    -D OLED_ADDR=0x3C
    ; OLED mount orientation fix (stock init shows left-right mirror):
    ; 0 = mounted normally   -> sends 0xA0 (SEGREMAP normal) + 0xC8 (COMSCAN normal)
    ; 1 = mounted rotated 180 -> sends 0xA1 (SEGREMAP remap)  + 0xC0 (COMSCAN remap)
    -D OLED_MOUNT_ROTATED_180=0
    ; --- Servos (signal pins; 5V power; common GND) ---
    ; Remapped to safe NodeMCU pins (GPIO3=UART0 RX conflicts with Serial debug)
    -D PIN_SERVO_AZIM=14   ; D5
    -D PIN_SERVO_ELEV=12   ; D6
    ; --- WS2812 status LED (4 diodes) ---
    ; D4 on NodeMCU V3 = GPIO2
    -D PIN_WS2812=2
    -D WS2812_COUNT=4

lib_deps =
    adafruit/Adafruit SSD1306 @ 2.5.9
    adafruit/Adafruit GFX Library @ 1.11.9
    adafruit/Adafruit NeoPixel @ 1.12.3
